<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<title>Relais BioHack</title>
<style>body{font-family:system-ui,sans-serif;background:#0d1117;color:#e6edf3;max-width:560px;margin:15vh auto;padding:0 16px;line-height:1.6}a{color:#58a6ff}</style>
</head>
<body>
<p id="m">Retour vers BioHack…</p>
<script>
// Relais OAuth Withings : renvoie le navigateur vers BioHack sur ce PC, sans rien conserver.
var q=new URLSearchParams(location.search),out=new URLSearchParams();
['code','state','error'].forEach(function(k){if(q.has(k))out.set(k,q.get(k))});
if(out.has('state')){location.replace('http://127.0.0.1:8769/withings/callback?'+out.toString())}
else{document.getElementById('m').textContent='Page relais de BioHack pour l’autorisation Withings. Rien à faire ici.'}
</script>
</body>
</html>
